<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cartoon Converter — Absürd & Komik</title>
  <style>
    :root {
      --bg: #0f0f1a;
      --panel: #1a1a2e;
      --border: #2a2a4a;
      --accent: #ff4d6d;
      --accent2: #4de1ff;
      --accent3: #ffd166;
      --text: #e8e8f0;
      --muted: #888899;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    header {
      text-align: center;
      padding: 32px 16px 16px;
      border-bottom: 1px solid var(--border);
    }

    header h1 {
      font-size: clamp(1.6rem, 4vw, 2.4rem);
      background: linear-gradient(135deg, var(--accent), var(--accent3), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.5px;
    }

    header p {
      color: var(--muted);
      margin-top: 6px;
      font-size: 0.9rem;
    }

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px 16px 48px;
    }

    /* ── API KEY ── */
    .api-section {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .api-section label {
      font-size: 0.85rem;
      color: var(--muted);
      white-space: nowrap;
    }

    .api-section input {
      flex: 1;
      min-width: 220px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 8px 12px;
      font-size: 0.9rem;
      outline: none;
    }

    .api-section input:focus { border-color: var(--accent2); }

    .badge {
      font-size: 0.7rem;
      padding: 2px 8px;
      border-radius: 20px;
      background: rgba(77,225,255,0.15);
      color: var(--accent2);
      border: 1px solid rgba(77,225,255,0.3);
    }

    /* ── UPLOAD ── */
    .upload-zone {
      border: 2px dashed var(--border);
      border-radius: 16px;
      padding: 40px 20px;
      text-align: center;
      cursor: pointer;
      transition: border-color .2s, background .2s;
      margin-bottom: 24px;
      position: relative;
    }

    .upload-zone:hover,
    .upload-zone.drag-over {
      border-color: var(--accent);
      background: rgba(255,77,109,0.05);
    }

    .upload-zone input[type=file] {
      position: absolute; inset: 0;
      opacity: 0; cursor: pointer;
      width: 100%; height: 100%;
    }

    .upload-icon { font-size: 3rem; margin-bottom: 12px; }

    .upload-zone h2 { font-size: 1.1rem; margin-bottom: 6px; }

    .upload-zone p { font-size: 0.85rem; color: var(--muted); }

    /* ── CONTROLS ── */
    .controls {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 24px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
    }

    .ctrl-group label {
      display: block;
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .ctrl-group select,
    .ctrl-group input[type=range] {
      width: 100%;
    }

    select {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 7px 10px;
      font-size: 0.875rem;
      outline: none;
      cursor: pointer;
    }

    select:focus { border-color: var(--accent2); }

    input[type=range] {
      accent-color: var(--accent);
      cursor: pointer;
    }

    .range-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .range-val {
      font-size: 0.8rem;
      color: var(--accent3);
      min-width: 28px;
      text-align: right;
    }

    /* ── PROCESS BUTTON ── */
    .btn-process {
      display: block;
      width: 100%;
      padding: 14px;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: .5px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), #c2185b);
      color: #fff;
      cursor: pointer;
      transition: opacity .2s, transform .1s;
      margin-bottom: 28px;
    }

    .btn-process:hover { opacity: .9; }
    .btn-process:active { transform: scale(.98); }
    .btn-process:disabled { opacity: .4; cursor: not-allowed; }

    /* ── PROGRESS ── */
    .progress-bar {
      height: 4px;
      background: var(--border);
      border-radius: 4px;
      margin-bottom: 24px;
      overflow: hidden;
      display: none;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      transition: width .3s;
    }

    .status-msg {
      text-align: center;
      font-size: 0.85rem;
      color: var(--accent2);
      margin-bottom: 16px;
      min-height: 20px;
    }

    /* ── RESULTS ── */
    .results {
      display: none;
      gap: 20px;
      margin-bottom: 24px;
    }

    .results.visible {
      display: grid;
      grid-template-columns: 1fr 1fr;
    }

    @media (max-width: 640px) {
      .results.visible { grid-template-columns: 1fr; }
    }

    .result-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }

    .result-card h3 {
      padding: 12px 16px;
      font-size: 0.85rem;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
    }

    .result-card canvas,
    .result-card img {
      width: 100%;
      display: block;
    }

    /* ── CAPTION BOX ── */
    .caption-section {
      display: none;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 24px;
    }

    .caption-section.visible { display: block; }

    .caption-section h3 {
      font-size: 1rem;
      margin-bottom: 12px;
      color: var(--accent3);
    }

    .comic-caption {
      background: #fff8e1;
      color: #222;
      border-radius: 8px;
      padding: 14px 18px;
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 10px;
      border-left: 4px solid var(--accent3);
      white-space: pre-wrap;
    }

    /* ── DOWNLOAD ── */
    .btn-download {
      display: inline-block;
      padding: 10px 24px;
      font-size: 0.9rem;
      font-weight: 600;
      border: 2px solid var(--accent2);
      border-radius: 10px;
      color: var(--accent2);
      background: transparent;
      cursor: pointer;
      transition: background .2s, color .2s;
      text-decoration: none;
    }

    .btn-download:hover {
      background: var(--accent2);
      color: var(--bg);
    }

    .download-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    /* ── TOAST ── */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #1e1e2e;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 18px;
      font-size: 0.875rem;
      max-width: 320px;
      box-shadow: 0 8px 24px rgba(0,0,0,.4);
      opacity: 0;
      transform: translateY(10px);
      transition: opacity .3s, transform .3s;
      pointer-events: none;
      z-index: 999;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    .toast.error { border-color: var(--accent); color: #ffaaaa; }
    .toast.success { border-color: #4caf50; color: #aaffaa; }
  </style>
</head>
<body>

<header>
  <h1>🎨 Cartoon Converter</h1>
  <p>Görselinizi absürd &amp; komik cartoon stiline dönüştürün</p>
</header>

<main>

  <!-- API KEY -->
  <div class="api-section">
    <label for="apiKey">Anthropic API Key <span class="badge">Opsiyonel — komik metin için</span></label>
    <input type="password" id="apiKey" placeholder="sk-ant-..." autocomplete="off" />
  </div>

  <!-- UPLOAD -->
  <div class="upload-zone" id="uploadZone">
    <input type="file" id="fileInput" accept="image/*" />
    <div class="upload-icon">🖼️</div>
    <h2>Görsel yükle veya buraya sürükle</h2>
    <p>PNG, JPEG, WebP, GIF desteklenir · Maks 10 MB</p>
  </div>

  <!-- CONTROLS -->
  <div class="controls">
    <div class="ctrl-group">
      <label>Cartoon Stili</label>
      <select id="styleSelect">
        <option value="classic">🖍️ Klasik Cartoon</option>
        <option value="absurd" selected>🤡 Absürd &amp; Komik</option>
        <option value="popart">🎨 Pop Art</option>
        <option value="inkwash">🖊️ Ink Wash</option>
      </select>
    </div>

    <div class="ctrl-group">
      <label>Kenar Kalınlığı</label>
      <div class="range-row">
        <input type="range" id="edgeStrength" min="0" max="100" value="60" />
        <span class="range-val" id="edgeVal">60</span>
      </div>
    </div>

    <div class="ctrl-group">
      <label>Renk Sayısı (Kuantizasyon)</label>
      <div class="range-row">
        <input type="range" id="colorCount" min="3" max="16" value="8" />
        <span class="range-val" id="colorVal">8</span>
      </div>
    </div>

    <div class="ctrl-group">
      <label>Düzleştirme</label>
      <div class="range-row">
        <input type="range" id="smoothing" min="0" max="5" value="2" />
        <span class="range-val" id="smoothVal">2</span>
      </div>
    </div>
  </div>

  <!-- PROCESS -->
  <button class="btn-process" id="processBtn" disabled>⚡ Cartoon'a Dönüştür</button>

  <!-- PROGRESS -->
  <div class="progress-bar" id="progressBar">
    <div class="progress-fill" id="progressFill"></div>
  </div>
  <div class="status-msg" id="statusMsg"></div>

  <!-- RESULTS -->
  <div class="results" id="results">
    <div class="result-card">
      <h3>📸 Orijinal</h3>
      <img id="originalImg" src="" alt="Orijinal" />
    </div>
    <div class="result-card">
      <h3>🎨 Cartoon</h3>
      <canvas id="cartoonCanvas"></canvas>
    </div>
  </div>

  <!-- CAPTION -->
  <div class="caption-section" id="captionSection">
    <h3>💬 Claude'un Yorumu</h3>
    <div class="comic-caption" id="captionText"></div>
    <div class="download-row">
      <button class="btn-download" id="downloadBtn">⬇️ Cartoon İndir</button>
      <button class="btn-download" id="downloadWithCaptionBtn" style="border-color:var(--accent3);color:var(--accent3)">
        📄 Yorum ile İndir
      </button>
    </div>
  </div>

  <div class="download-row" id="simpleDownload" style="display:none">
    <button class="btn-download" id="downloadBtnSimple">⬇️ Cartoon İndir</button>
  </div>

</main>

<div class="toast" id="toast"></div>

<script>
// ──────────────────────────────────────────────
//  STATE
// ──────────────────────────────────────────────
let originalImage = null;     // HTMLImageElement
let originalFile  = null;     // File

// ──────────────────────────────────────────────
//  DOM
// ──────────────────────────────────────────────
const uploadZone    = document.getElementById('uploadZone');
const fileInput     = document.getElementById('fileInput');
const processBtn    = document.getElementById('processBtn');
const progressBar   = document.getElementById('progressBar');
const progressFill  = document.getElementById('progressFill');
const statusMsg     = document.getElementById('statusMsg');
const results       = document.getElementById('results');
const originalImg   = document.getElementById('originalImg');
const cartoonCanvas = document.getElementById('cartoonCanvas');
const captionSection= document.getElementById('captionSection');
const captionText   = document.getElementById('captionText');
const simpleDownload= document.getElementById('simpleDownload');

const edgeInput   = document.getElementById('edgeStrength');
const colorInput  = document.getElementById('colorCount');
const smoothInput = document.getElementById('smoothing');

edgeInput.oninput  = () => document.getElementById('edgeVal').textContent  = edgeInput.value;
colorInput.oninput = () => document.getElementById('colorVal').textContent = colorInput.value;
smoothInput.oninput= () => document.getElementById('smoothVal').textContent= smoothInput.value;

// ──────────────────────────────────────────────
//  UPLOAD
// ──────────────────────────────────────────────
uploadZone.addEventListener('dragover', e => {
  e.preventDefault();
  uploadZone.classList.add('drag-over');
});
uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('drag-over'));
uploadZone.addEventListener('drop', e => {
  e.preventDefault();
  uploadZone.classList.remove('drag-over');
  if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', () => {
  if (fileInput.files.length) handleFile(fileInput.files[0]);
});

function handleFile(file) {
  if (!file.type.startsWith('image/')) { toast('Lütfen bir görsel dosyası seçin.', 'error'); return; }
  if (file.size > 10 * 1024 * 1024) { toast('Dosya boyutu 10 MB\'ı geçemez.', 'error'); return; }

  originalFile = file;
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = () => {
    originalImage = img;
    originalImg.src = url;
    results.classList.remove('visible');
    captionSection.classList.remove('visible');
    simpleDownload.style.display = 'none';
    processBtn.disabled = false;
    uploadZone.querySelector('h2').textContent = '✅ ' + file.name;
  };
  img.src = url;
}

// ──────────────────────────────────────────────
//  MAIN PROCESS
// ──────────────────────────────────────────────
processBtn.addEventListener('click', async () => {
  if (!originalImage) return;
  processBtn.disabled = true;

  try {
    await runPipeline();
  } catch(err) {
    toast('Hata: ' + err.message, 'error');
    console.error(err);
  } finally {
    processBtn.disabled = false;
  }
});

async function runPipeline() {
  const style      = document.getElementById('styleSelect').value;
  const edgeStr    = parseInt(edgeInput.value);
  const numColors  = parseInt(colorInput.value);
  const smooth     = parseInt(smoothInput.value);
  const apiKey     = document.getElementById('apiKey').value.trim();

  progressBar.style.display = 'block';
  setProgress(5, 'Görsel işleniyor...');

  // 1. Draw original on offscreen canvas
  const src = drawToCanvas(originalImage);

  setProgress(15, 'Renk kuantizasyonu yapılıyor...');
  await tick();

  // 2. Quantize colors
  const quantized = quantizeColors(src, numColors);

  setProgress(35, 'Kenarlar tespit ediliyor...');
  await tick();

  // 3. Edge detection
  const edges = sobelEdges(src);

  setProgress(55, 'Cartoon efekti uygulanıyor...');
  await tick();

  // 4. Combine + style
  const cartoon = applyStyle(quantized, edges, style, edgeStr, smooth);

  setProgress(70, 'Canvas\'a çiziliyor...');
  await tick();

  // 5. Show result
  cartoonCanvas.width  = cartoon.width;
  cartoonCanvas.height = cartoon.height;
  const ctx = cartoonCanvas.getContext('2d');
  ctx.putImageData(cartoon, 0, 0);

  results.classList.add('visible');
  simpleDownload.style.display    = 'none';
  captionSection.classList.remove('visible');

  // 6. Claude captions (optional)
  if (apiKey) {
    setProgress(75, 'Claude\'a soruluyor...');
    await tick();
    try {
      const caption = await fetchClaudeCaption(apiKey, cartoon);
      captionText.textContent = caption;
      captionSection.classList.add('visible');
      renderCaptionOnCanvas(cartoon, caption);
    } catch(e) {
      console.warn('Claude API hatası:', e);
      toast('Claude yanıtı alınamadı: ' + e.message, 'error');
      simpleDownload.style.display = 'flex';
    }
  } else {
    simpleDownload.style.display = 'flex';
  }

  setProgress(100, 'Tamamlandı! 🎉');
  setTimeout(() => {
    progressBar.style.display = 'none';
    statusMsg.textContent = '';
  }, 1500);
}

// ──────────────────────────────────────────────
//  IMAGE PROCESSING
// ──────────────────────────────────────────────
function drawToCanvas(img) {
  const MAX = 900;
  let w = img.naturalWidth  || img.width;
  let h = img.naturalHeight || img.height;
  if (w > MAX || h > MAX) {
    const s = MAX / Math.max(w, h);
    w = Math.round(w * s);
    h = Math.round(h * s);
  }
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  c.getContext('2d').drawImage(img, 0, 0, w, h);
  return c.getContext('2d').getImageData(0, 0, w, h);
}

// Simple box blur
function boxBlur(data, w, h, radius) {
  if (radius < 1) return data;
  const src = new Uint8ClampedArray(data);
  const d   = data;
  const r   = Math.max(1, radius);

  for (let pass = 0; pass < 2; pass++) {
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        let rr=0,gg=0,bb=0,cnt=0;
        for (let dy = -r; dy <= r; dy++) {
          const ny = Math.min(h-1, Math.max(0, y+dy));
          for (let dx = -r; dx <= r; dx++) {
            const nx = Math.min(w-1, Math.max(0, x+dx));
            const idx = (ny*w+nx)*4;
            rr += src[idx]; gg += src[idx+1]; bb += src[idx+2];
            cnt++;
          }
        }
        const i = (y*w+x)*4;
        d[i]   = rr/cnt;
        d[i+1] = gg/cnt;
        d[i+2] = bb/cnt;
      }
    }
    src.set(d);
  }
  return d;
}

// Sobel edge detection → returns Float32Array magnitude map [0..1]
function sobelEdges(imgData) {
  const { data, width: w, height: h } = imgData;
  const mag = new Float32Array(w * h);
  for (let y = 1; y < h-1; y++) {
    for (let x = 1; x < w-1; x++) {
      const luma = (p) => {
        const i = (p[0]*w + p[1]) * 4;
        return (data[i]*0.299 + data[i+1]*0.587 + data[i+2]*0.114) / 255;
      };
      const tl=luma([y-1,x-1]),tm=luma([y-1,x]),tr=luma([y-1,x+1]);
      const ml=luma([y,x-1]),              mr=luma([y,x+1]);
      const bl=luma([y+1,x-1]),bm=luma([y+1,x]),br=luma([y+1,x+1]);
      const gx = -tl -2*ml -bl +tr +2*mr +br;
      const gy = -tl -2*tm -tr +bl +2*bm +br;
      mag[y*w+x] = Math.min(1, Math.sqrt(gx*gx + gy*gy));
    }
  }
  return mag;
}

// Color quantization via k-means (simplified — use palette approximation)
function quantizeColors(imgData, k) {
  const { data, width: w, height: h } = imgData;
  const out = new Uint8ClampedArray(data);

  // Build a small palette by sampling pixels
  const step = Math.max(1, Math.floor(w * h / 512));
  let palette = [];
  for (let i = 0; i < w * h; i += step) {
    const idx = i * 4;
    palette.push([data[idx], data[idx+1], data[idx+2]]);
  }

  // K-means iteration (4 passes)
  let centers = palette.slice(0, k).map(c => [...c]);
  for (let iter = 0; iter < 5; iter++) {
    const sums   = Array.from({length: k}, () => [0,0,0]);
    const counts = new Array(k).fill(0);
    for (let i = 0; i < w*h; i++) {
      const idx = i*4;
      const r=data[idx], g=data[idx+1], b=data[idx+2];
      let best=0, bestD=Infinity;
      for (let c=0; c<k; c++) {
        const dr=r-centers[c][0], dg=g-centers[c][1], db=b-centers[c][2];
        const d = dr*dr+dg*dg+db*db;
        if (d < bestD) { bestD=d; best=c; }
      }
      sums[best][0]+=r; sums[best][1]+=g; sums[best][2]+=b;
      counts[best]++;
    }
    for (let c=0; c<k; c++) {
      if (counts[c] > 0) {
        centers[c] = [sums[c][0]/counts[c], sums[c][1]/counts[c], sums[c][2]/counts[c]];
      }
    }
  }

  // Map each pixel to nearest center
  for (let i = 0; i < w*h; i++) {
    const idx = i*4;
    const r=data[idx], g=data[idx+1], b=data[idx+2];
    let best=0, bestD=Infinity;
    for (let c=0; c<k; c++) {
      const dr=r-centers[c][0], dg=g-centers[c][1], db=b-centers[c][2];
      const d = dr*dr+dg*dg+db*db;
      if (d < bestD) { bestD=d; best=c; }
    }
    out[idx]   = centers[best][0];
    out[idx+1] = centers[best][1];
    out[idx+2] = centers[best][2];
    out[idx+3] = data[idx+3];
  }

  return new ImageData(out, w, h);
}

function applyStyle(quantized, edges, style, edgeStrength, smoothRadius) {
  const { width: w, height: h } = quantized;
  const result = new Uint8ClampedArray(quantized.data);
  const edgeThr = (100 - edgeStrength) / 100 * 0.4;  // lower = more edges

  // Optional smooth on quantized first
  if (smoothRadius > 0) boxBlur(result, w, h, smoothRadius);

  // Style-specific color treatment
  for (let i = 0; i < w*h; i++) {
    const idx = i*4;
    let r = result[idx], g = result[idx+1], b = result[idx+2];

    if (style === 'absurd') {
      // Boost saturation wildly
      const max = Math.max(r,g,b), min = Math.min(r,g,b);
      const l = (max+min)/2;
      if (max !== min) {
        const sat = (max-min)/(max+min < 255 ? max+min : 510-(max+min));
        const boost = Math.min(1, sat * 2.5);
        r = Math.round(l + (r-l)*boost*2.2);
        g = Math.round(l + (g-l)*boost*2.2);
        b = Math.round(l + (b-l)*boost*2.2);
      }
      // Add slight hue shift
      const tmp = r;
      r = Math.min(255, g * 1.1);
      g = Math.min(255, b * 0.9 + 20);
      b = Math.min(255, tmp * 1.05);
    } else if (style === 'popart') {
      // High contrast, pure-ish colors
      r = r > 128 ? Math.min(255, r*1.4) : Math.max(0, r*0.6);
      g = g > 128 ? Math.min(255, g*1.4) : Math.max(0, g*0.6);
      b = b > 128 ? Math.min(255, b*1.4) : Math.max(0, b*0.6);
    } else if (style === 'inkwash') {
      // Desaturate slightly, warm tones
      const avg = (r+g+b)/3;
      r = Math.round(avg*0.4 + r*0.6);
      g = Math.round(avg*0.3 + g*0.7);
      b = Math.round(avg*0.5 + b*0.5);
    }

    result[idx]   = Math.max(0,Math.min(255,r));
    result[idx+1] = Math.max(0,Math.min(255,g));
    result[idx+2] = Math.max(0,Math.min(255,b));
  }

  // Apply edges as dark outlines
  for (let i = 0; i < w*h; i++) {
    const e = edges[i];
    if (e > edgeThr) {
      const idx = i*4;
      const strength = Math.min(1, (e - edgeThr) / (1 - edgeThr));
      result[idx]   = Math.round(result[idx]   * (1 - strength * 0.9));
      result[idx+1] = Math.round(result[idx+1] * (1 - strength * 0.9));
      result[idx+2] = Math.round(result[idx+2] * (1 - strength * 0.9));
    }
  }

  // Absürd style: add random color noise spots
  if (style === 'absurd') {
    const noiseCount = Math.floor(w*h * 0.003);
    for (let n = 0; n < noiseCount; n++) {
      const i = Math.floor(Math.random() * w*h);
      const idx = i*4;
      result[idx]   = Math.floor(Math.random()*256);
      result[idx+1] = Math.floor(Math.random()*256);
      result[idx+2] = Math.floor(Math.random()*256);
    }
  }

  return new ImageData(result, w, h);
}

// ──────────────────────────────────────────────
//  CLAUDE API
// ──────────────────────────────────────────────
async function fetchClaudeCaption(apiKey, cartoonData) {
  // Convert canvas to base64
  const tmpCanvas = document.createElement('canvas');
  tmpCanvas.width  = cartoonData.width;
  tmpCanvas.height = cartoonData.height;
  tmpCanvas.getContext('2d').putImageData(cartoonData, 0, 0);
  const b64 = tmpCanvas.toDataURL('image/jpeg', 0.85).split(',')[1];

  const prompt = `Bu cartoon görseli inceleyip absürd, aşırı komik ve biraz saçma bir şekilde yorumla.
Sanki bir stand-up komedyen bu sahnedeki kişiler/nesneler hakkında aniden fırlattığı bir yorum yapıyor gibi düşün.
Türkçe yaz. Kısa ve vurucu olsun (2-4 cümle).
Mümkünse görseldeki kişi ya da objelere direkt hitap et.
Çok abartılı, beklenmedik ve absürd bir benzetme ya da hikaye anlat.
Sadece komik metni yaz, açıklama veya "İşte yorumum:" gibi girişler ekleme.`;

  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'x-api-key': apiKey,
      'anthropic-version': '2023-06-01',
      'content-type': 'application/json',
      'anthropic-dangerous-direct-browser-access': 'true',
    },
    body: JSON.stringify({
      model: 'claude-opus-4-6',
      max_tokens: 300,
      messages: [{
        role: 'user',
        content: [
          {
            type: 'image',
            source: { type: 'base64', media_type: 'image/jpeg', data: b64 }
          },
          { type: 'text', text: prompt }
        ]
      }]
    })
  });

  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err?.error?.message || `API ${res.status}`);
  }

  const json = await res.json();
  return json.content?.[0]?.text ?? '(Yanıt alınamadı)';
}

// ──────────────────────────────────────────────
//  RENDER CAPTION ON CANVAS
// ──────────────────────────────────────────────
function renderCaptionOnCanvas(imgData, caption) {
  const w = imgData.width, h = imgData.height;
  cartoonCanvas.width  = w;
  cartoonCanvas.height = h;
  const ctx = cartoonCanvas.getContext('2d');
  ctx.putImageData(imgData, 0, 0);

  if (!caption) return;

  // Speech bubble at bottom
  const padding   = 14;
  const maxWidth  = w - padding*2 - 24;
  const fontSize  = Math.max(13, Math.min(18, w / 30));
  ctx.font        = `bold ${fontSize}px 'Segoe UI', sans-serif`;

  const lines     = wrapText(ctx, caption, maxWidth);
  const lineH     = fontSize * 1.4;
  const boxH      = lines.length * lineH + padding * 2;
  const boxY      = h - boxH - 14;

  // Shadow
  ctx.fillStyle   = 'rgba(0,0,0,0.4)';
  roundRect(ctx, 16, boxY+4, w-32, boxH, 12);
  ctx.fill();

  // Box
  ctx.fillStyle   = '#fff9c4';
  roundRect(ctx, 12, boxY, w-24, boxH, 12);
  ctx.fill();
  ctx.strokeStyle = '#e65100';
  ctx.lineWidth   = 2.5;
  roundRect(ctx, 12, boxY, w-24, boxH, 12);
  ctx.stroke();

  // Text
  ctx.fillStyle   = '#1a0000';
  ctx.font        = `bold ${fontSize}px 'Segoe UI', sans-serif`;
  lines.forEach((line, i) => {
    ctx.fillText(line, 24, boxY + padding + fontSize + i * lineH);
  });
}

function wrapText(ctx, text, maxW) {
  const words = text.split(' ');
  const lines = [];
  let cur = '';
  for (const w of words) {
    const test = cur ? cur + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && cur) {
      lines.push(cur);
      cur = w;
    } else {
      cur = test;
    }
  }
  if (cur) lines.push(cur);
  return lines;
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.lineTo(x+w-r, y);
  ctx.quadraticCurveTo(x+w, y, x+w, y+r);
  ctx.lineTo(x+w, y+h-r);
  ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
  ctx.lineTo(x+r, y+h);
  ctx.quadraticCurveTo(x, y+h, x, y+h-r);
  ctx.lineTo(x, y+r);
  ctx.quadraticCurveTo(x, y, x+r, y);
  ctx.closePath();
}

// ──────────────────────────────────────────────
//  DOWNLOAD
// ──────────────────────────────────────────────
function downloadCanvas(canvas, name) {
  const a = document.createElement('a');
  a.download = name;
  a.href = canvas.toDataURL('image/png');
  a.click();
}

document.getElementById('downloadBtn').onclick = () => {
  // Download the canvas WITHOUT caption (pure cartoon)
  const tmpC = document.createElement('canvas');
  tmpC.width  = cartoonCanvas.width;
  tmpC.height = cartoonCanvas.height;
  const ctx = tmpC.getContext('2d');
  // Re-draw without caption — just the cartoon image data
  ctx.drawImage(cartoonCanvas, 0, 0);
  downloadCanvas(cartoonCanvas, 'cartoon.png');
};

document.getElementById('downloadWithCaptionBtn').onclick = () =>
  downloadCanvas(cartoonCanvas, 'cartoon-with-caption.png');

document.getElementById('downloadBtnSimple').onclick = () =>
  downloadCanvas(cartoonCanvas, 'cartoon.png');

// ──────────────────────────────────────────────
//  HELPERS
// ──────────────────────────────────────────────
function setProgress(pct, msg) {
  progressFill.style.width = pct + '%';
  statusMsg.textContent    = msg;
}

function tick() {
  return new Promise(r => setTimeout(r, 0));
}

function toast(msg, type='') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className   = 'toast show ' + type;
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 3500);
}
