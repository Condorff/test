<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>BBA Display – 9:16</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* =====================================================
   OBS Browser Source: 1080 × 1920  (9:16 portrait)
   Transparent body – only UI strips are opaque.
   ===================================================== */
:root {
  --p1:  #00d4ff;
  --p1g: #0055ff;
  --p2:  #ff3333;
  --p2g: #bb0000;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width:  1080px;
  height: 1920px;
  background: transparent;          /* OBS composites camera behind */
  color: #fff;
  font-family: 'Orbitron', monospace;
  overflow: hidden;
  user-select: none;
}

.wrap {
  width:  1080px;
  height: 1920px;
  display: flex;
  flex-direction: column;
}

/* ====================================================
   HEADER  –  110 px
   ==================================================== */
.header {
  height: 110px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  padding: 0 14px;
  gap: 0;
  background: linear-gradient(180deg, rgba(12,12,28,0.97) 0%, rgba(6,6,18,0.96) 100%);
  border-bottom: 2px solid rgba(0,160,255,0.3);
  position: relative;
  z-index: 10;
}

/* top glow stripe */
.header::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg,
    transparent 0%,
    rgba(0,180,255,0.9) 25%,
    rgba(255,50,50,0.9) 75%,
    transparent 100%);
}

/* bottom corner cuts */
.header::after {
  content: '';
  position: absolute;
  bottom: -1px; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg,
    rgba(0,160,255,0.4) 0%,
    rgba(0,160,255,0.08) 40%,
    rgba(255,50,50,0.08) 60%,
    rgba(255,50,50,0.4) 100%);
}

/* ── LIVE badge ── */
.live-badge {
  display: flex;
  align-items: center;
  gap: 7px;
  background: rgba(150,0,0,0.18);
  border: 1.5px solid rgba(200,0,0,0.75);
  border-radius: 4px;
  padding: 7px 14px;
  color: #ff4444;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 3px;
  flex-shrink: 0;
}

.live-dot {
  width: 9px;
  height: 9px;
  background: #ff1111;
  border-radius: 50%;
  box-shadow: 0 0 8px #ff0000, 0 0 18px #ff0000;
  animation: livePulse 1.2s ease-in-out infinite;
}

@keyframes livePulse {
  0%, 100% { opacity: 1; }
  50%       { opacity: 0.25; }
}

/* ── Player 1 name ── */
.p1-section {
  flex: 1;
  display: flex;
  justify-content: flex-end;
  align-items: center;
  padding-right: 16px;
  overflow: hidden;
}

.p1-name {
  font-size: 30px;
  font-weight: 900;
  font-style: italic;
  letter-spacing: 2px;
  background: linear-gradient(180deg, #ffffff 0%, #88eeff 35%, var(--p1) 65%, var(--p1g) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  filter: drop-shadow(0 0 7px var(--p1)) drop-shadow(0 0 18px var(--p1g));
  white-space: nowrap;
}

/* ── Score box ── */
.score-box {
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  background: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(0,0,0,0.65));
  border: 1px solid rgba(255,255,255,0.13);
  border-radius: 6px;
  padding: 4px 22px 6px;
  min-width: 170px;
  position: relative;
}

.score-box::before {
  content: '';
  position: absolute;
  top: -1px; left: 15%; right: 15%;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.55), transparent);
}

.score-row {
  display: flex;
  align-items: center;
  gap: 10px;
  line-height: 1;
}

.sc1  { font-size: 48px; font-weight: 900; color: var(--p1); text-shadow: 0 0 18px var(--p1); }
.sc2  { font-size: 48px; font-weight: 900; color: var(--p2); text-shadow: 0 0 18px var(--p2); }
.sc-d { font-size: 38px; font-weight: 900; color: #bbd0e0; }

.round-label {
  font-size: 10px;
  font-family: 'Rajdhani', sans-serif;
  font-weight: 600;
  color: #6688aa;
  letter-spacing: 5px;
  margin-top: 1px;
}

/* ── Player 2 name ── */
.p2-section {
  flex: 1;
  display: flex;
  justify-content: flex-start;
  align-items: center;
  padding-left: 16px;
  overflow: hidden;
}

.p2-name {
  font-size: 30px;
  font-weight: 900;
  font-style: italic;
  letter-spacing: 2px;
  background: linear-gradient(180deg, #ffffff 0%, #ffbbbb 35%, var(--p2) 65%, var(--p2g) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  filter: drop-shadow(0 0 7px var(--p2)) drop-shadow(0 0 18px var(--p2g));
  white-space: nowrap;
}

/* ── Header buttons ── */
.hdr-btns {
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  gap: 5px;
  margin-left: 10px;
}

.hdr-btn {
  background: rgba(0,6,2,0.82);
  border: 1px solid rgba(0,190,80,0.42);
  color: #00bb60;
  padding: 5px 9px;
  font-size: 9px;
  font-family: 'Rajdhani', sans-serif;
  font-weight: 700;
  letter-spacing: 1px;
  border-radius: 3px;
  display: flex;
  align-items: center;
  gap: 5px;
  white-space: nowrap;
}

/* ====================================================
   MAIN  –  flex-1  (≈1595 px)
   ==================================================== */
.main {
  flex: 1;
  display: flex;
  overflow: hidden;
  position: relative;
}

/* ── Left panel (OBS source) ── */
.panel-left {
  width: 108px;
  flex-shrink: 0;
  background: transparent;
  position: relative;
  border-right: 1px solid rgba(0,140,255,0.18);
}

/* vertical neon strip */
.panel-left::after {
  content: '';
  position: absolute;
  top: 8%; right: 0;
  width: 2px;
  height: 84%;
  background: linear-gradient(180deg,
    transparent 0%, rgba(0,200,255,0.6) 30%,
    rgba(0,200,255,0.8) 50%, rgba(0,200,255,0.6) 70%,
    transparent 100%);
  box-shadow: 0 0 12px rgba(0,180,255,0.25);
}

/* corner bracket top */
.panel-left::before {
  content: '';
  position: absolute;
  top: 0; right: 0;
  width: 40px;
  height: 40px;
  border-top: 2px solid rgba(0,200,255,0.45);
  border-right: 2px solid rgba(0,200,255,0.45);
}

/* ── Arena center (OBS camera behind) ── */
.arena {
  flex: 1;
  background: transparent;
  position: relative;
}

/* ── Right panel (OBS source) ── */
.panel-right {
  width: 108px;
  flex-shrink: 0;
  background: transparent;
  position: relative;
  border-left: 1px solid rgba(255,50,50,0.18);
}

.panel-right::before {
  content: '';
  position: absolute;
  top: 8%; left: 0;
  width: 2px;
  height: 84%;
  background: linear-gradient(180deg,
    transparent 0%, rgba(255,80,80,0.6) 30%,
    rgba(255,80,80,0.8) 50%, rgba(255,80,80,0.6) 70%,
    transparent 100%);
  box-shadow: 0 0 12px rgba(255,60,60,0.25);
}

.panel-right::after {
  content: '';
  position: absolute;
  top: 0; left: 0;
  width: 40px;
  height: 40px;
  border-top: 2px solid rgba(255,80,80,0.45);
  border-left: 2px solid rgba(255,80,80,0.45);
}

/* ====================================================
   LIKE & SUBSCRIBE  –  145 px
   ==================================================== */
.ls-bar {
  height: 145px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(180deg,
    rgba(5,5,14,0.96) 0%,
    rgba(10,10,28,0.98) 50%,
    rgba(5,5,14,0.96) 100%);
  border-top: 1px solid rgba(80,80,240,0.35);
  border-bottom: 1px solid rgba(80,80,240,0.35);
  overflow: hidden;
  position: relative;
}

/* scanning top neon line */
.ls-bar::before {
  content: '';
  position: absolute;
  top: 0; left: -100%; width: 200%;
  height: 2px;
  background: linear-gradient(90deg,
    transparent 0%, #0080ff 12%, #8800ff 24%,
    #ff00aa 36%, #ff6600 48%, #00ff88 60%,
    #00d4ff 72%, transparent 84%);
  animation: scan 2.8s linear infinite;
}

/* scanning bottom neon line */
.ls-bar::after {
  content: '';
  position: absolute;
  bottom: 0; left: 0; width: 200%;
  height: 2px;
  background: linear-gradient(90deg,
    transparent 0%, #00d4ff 12%, #00ff88 24%,
    #ff6600 36%, #ff00aa 48%, #8800ff 60%,
    #0080ff 72%, transparent 84%);
  animation: scan 2.8s linear infinite reverse;
}

@keyframes scan {
  0%   { transform: translateX(0%); }
  100% { transform: translateX(50%); }
}

.ls-content {
  display: flex;
  align-items: center;
  gap: 28px;
  position: relative;
  z-index: 1;
}

.ls-item {
  display: flex;
  align-items: center;
  gap: 14px;
  font-size: 34px;
  font-weight: 900;
  letter-spacing: 5px;
}

.ls-like { animation: neonCycle 5s ease-in-out infinite; }
.ls-sub  { animation: neonCycle 5s ease-in-out infinite 2.5s; }

@keyframes neonCycle {
  0%   { color: #00d4ff; text-shadow: 0 0 10px #00d4ff, 0 0 25px #0080ff, 0 0 55px #0040ff; }
  16%  { color: #ff00ff; text-shadow: 0 0 10px #ff00ff, 0 0 25px #cc00cc, 0 0 55px #880088; }
  33%  { color: #ff6600; text-shadow: 0 0 10px #ff6600, 0 0 25px #cc4400, 0 0 55px #882200; }
  50%  { color: #00ff88; text-shadow: 0 0 10px #00ff88, 0 0 25px #00cc66, 0 0 55px #008844; }
  66%  { color: #ffff00; text-shadow: 0 0 10px #ffff00, 0 0 25px #cccc00, 0 0 55px #888800; }
  83%  { color: #ff3366; text-shadow: 0 0 10px #ff3366, 0 0 25px #cc0044, 0 0 55px #880022; }
  100% { color: #00d4ff; text-shadow: 0 0 10px #00d4ff, 0 0 25px #0080ff, 0 0 55px #0040ff; }
}

.ls-icon {
  font-size: 36px;
  animation: bounce 1.5s ease-in-out infinite;
}
.ls-icon-sub { animation: bounce 1.5s ease-in-out infinite 0.75s; }

@keyframes bounce {
  0%, 100% { transform: scale(1) rotate(0deg); }
  50%       { transform: scale(1.22) rotate(-8deg); }
}

.ls-div {
  width: 2px;
  height: 60px;
  background: linear-gradient(180deg, transparent, rgba(200,200,255,0.85), transparent);
  animation: divPulse 2s ease-in-out infinite;
}

@keyframes divPulse {
  0%, 100% { opacity: 0.25; }
  50%       { opacity: 1; box-shadow: 0 0 14px #9999ff; }
}

.ls-deco {
  font-size: 14px;
  color: rgba(100,100,200,0.45);
  letter-spacing: 3px;
  font-family: 'Rajdhani', sans-serif;
  font-weight: 700;
}

/* ====================================================
   FOOTER  –  70 px
   ==================================================== */
.footer {
  height: 70px;
  flex-shrink: 0;
  background: rgba(0,0,0,0.94);
  border-top: 1px solid rgba(0,100,255,0.4);
  display: flex;
  align-items: center;
  padding: 0 18px;
  position: relative;
}

/* top glow stripe */
.footer::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg,
    rgba(0,160,255,0.5) 0%, rgba(0,160,255,0.12) 40%,
    rgba(255,50,50,0.12) 60%, rgba(255,50,50,0.5) 100%);
}

.footer-timer {
  font-family: 'Rajdhani', sans-serif;
  font-size: 20px;
  font-weight: 700;
  color: #88bbdd;
  display: flex;
  align-items: center;
  gap: 7px;
  letter-spacing: 2px;
}

.footer-brand {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 8px;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 7px;
  white-space: nowrap;
}

.fb-b { color: var(--p1); text-shadow: 0 0 10px var(--p1); }
.fb-a { color: var(--p2); text-shadow: 0 0 10px var(--p2); }
.fb-r { color: #ffffff; }

.footer-stats {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 20px;
  font-family: 'Rajdhani', sans-serif;
  font-size: 17px;
  font-weight: 600;
  color: #6688aa;
}

.footer-stat { display: flex; align-items: center; gap: 5px; }
</style>
</head>
<body>
<div class="wrap">

  <!-- ===== HEADER ===== -->
  <div class="header">
    <div class="live-badge">
      <div class="live-dot"></div>
      LIVE
    </div>

    <div class="p1-section">
      <div class="p1-name" id="p1Name">MESSI</div>
    </div>

    <div class="score-box">
      <div class="score-row">
        <span class="sc1" id="score1">2</span>
        <span class="sc-d">-</span>
        <span class="sc2" id="score2">1</span>
      </div>
      <div class="round-label">ROUND <span id="roundNum">4</span></div>
    </div>

    <div class="p2-section">
      <div class="p2-name" id="p2Name">RONALDO</div>
    </div>

    <div class="hdr-btns">
      <div class="hdr-btn">🎙️ NO COMMENTARY</div>
      <div class="hdr-btn">🎵 SOUND + RGB FOCUS</div>
    </div>
  </div>

  <!-- ===== MAIN (transparent – OBS composites behind) ===== -->
  <div class="main">
    <div class="panel-left"></div>
    <div class="arena"></div>
    <div class="panel-right"></div>
  </div>

  <!-- ===== LIKE & SUBSCRIBE ===== -->
  <div class="ls-bar">
    <div class="ls-content">
      <span class="ls-deco">///</span>
      <div class="ls-item ls-like">
        <span class="ls-icon">👍</span>LIKE
      </div>
      <div class="ls-div"></div>
      <div class="ls-item ls-sub">
        SUBSCRIBE<span class="ls-icon ls-icon-sub">🔔</span>
      </div>
      <span class="ls-deco">///</span>
    </div>
  </div>

  <!-- ===== FOOTER ===== -->
  <div class="footer">
    <div class="footer-timer">⏱ <span id="timerDisplay">06:39</span></div>

    <div class="footer-brand">
      <span class="fb-b">BEYBLADE</span>
      <span class="fb-a">BATTLE</span>
      <span class="fb-r">ARENA</span>
    </div>

    <div class="footer-stats">
      <div class="footer-stat">👥 <span id="viewerCount">2.9B</span></div>
      <div class="footer-stat">👍 <span id="likeCount">4.7B</span></div>
    </div>
  </div>

</div><!-- /wrap -->

<script>
  const KEY = 'bba_state';

  function applyState(s) {
    if (!s) return;
    set('p1Name',      s.p1Name);
    set('p2Name',      s.p2Name);
    set('score1',      s.score1);
    set('score2',      s.score2);
    set('roundNum',    s.roundNum);
    set('viewerCount', s.viewers);
    set('likeCount',   s.likes);
  }

  function set(id, val) {
    if (val === undefined || val === null || val === '') return;
    document.getElementById(id).textContent = val;
  }

  applyState(JSON.parse(localStorage.getItem(KEY) || 'null'));

  window.addEventListener('storage', e => {
    if (e.key === KEY) applyState(JSON.parse(e.newValue || 'null'));
  });

  let timerSec = 6 * 60 + 39;

  function syncTimer() {
    const raw = localStorage.getItem(KEY);
    if (!raw) return null;
    return JSON.parse(raw);
  }

  setInterval(() => {
    const s = syncTimer();
    if (s) {
      if (s.timerSeconds !== undefined) timerSec = +s.timerSeconds;
      if (s.timerRunning) timerSec = Math.max(0, timerSec - 1);
      if (s.timerRunning) {
        s.timerSeconds = timerSec;
        localStorage.setItem(KEY, JSON.stringify(s));
      }
    }
    const m  = Math.floor(timerSec / 60).toString().padStart(2,'0');
    const sc = (timerSec % 60).toString().padStart(2,'0');
    document.getElementById('timerDisplay').textContent = m + ':' + sc;
  }, 1000);
</script>
</body>
</html>
