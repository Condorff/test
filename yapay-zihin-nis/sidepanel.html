<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yapay Zihin Nis</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <div class="app">

    <!-- ── Header ── -->
    <header class="header">
      <div class="header-brand">
        <div class="brand-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" fill="white" stroke="white" stroke-width="1.5" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="brand-text">
          <span class="brand-name">Yapay Zihin</span>
          <span class="brand-sub">Nis Bulucu</span>
        </div>
      </div>
      <span class="header-badge">BETA</span>
    </header>

    <!-- ── API Key ── -->
    <section class="section">
      <div class="section-label">YouTube API Key</div>
      <div class="api-row">
        <input type="password" id="apiKey" class="input" placeholder="AIzaSy..." autocomplete="off" spellcheck="false">
        <button id="saveApiKey" class="btn btn-secondary btn-sm">Kaydet</button>
      </div>
      <div id="apiStatus" class="api-status"></div>
    </section>

    <!-- ── Filtreler ── -->
    <section class="section">
      <div class="section-label">Filtreler</div>

      <div class="filter-group">
        <label class="filter-label">Kanal Yasi</label>
        <div class="btn-group" id="ageGroup">
          <button class="btn-toggle active" data-age="30">30 Gun</button>
          <button class="btn-toggle" data-age="60">60 Gun</button>
          <button class="btn-toggle" data-age="90">90 Gun</button>
        </div>
      </div>

      <div class="filter-row">
        <div class="filter-group">
          <label class="filter-label" for="minSubs">Min Abone</label>
          <input type="number" id="minSubs" class="input" value="1000" min="0" step="100">
        </div>
        <div class="filter-group">
          <label class="filter-label" for="maxSubs">Max Abone</label>
          <input type="number" id="maxSubs" class="input" value="50000" min="0" step="1000">
        </div>
      </div>

      <div class="filter-row">
        <div class="filter-group">
          <label class="filter-label" for="outlierPct">Outlier Esigi (%)</label>
          <input type="number" id="outlierPct" class="input" value="300" min="50" step="50">
        </div>
        <div class="filter-group">
          <label class="filter-label" for="maxChannels">Maks. Kanal</label>
          <input type="number" id="maxChannels" class="input" value="60" min="10" max="200" step="10">
        </div>
      </div>

      <div class="filter-group">
        <label class="filter-label" for="keywords">Arama Kelimeleri <span class="label-hint">(her satira bir kelime)</span></label>
        <textarea id="keywords" class="textarea" rows="5" spellcheck="false">faceless ai channel
ai youtube automation
ai generated videos
chatgpt youtube channel
faceless youtube 2024
yapay zeka kanal</textarea>
      </div>
    </section>

    <!-- ── Tarama Butonu ── -->
    <div class="scan-section">
      <button id="scanBtn" class="btn btn-primary btn-scan">
        <svg id="scanIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
        <span id="scanBtnText">Nis Taramasi Baslat</span>
      </button>
    </div>

    <!-- ── Ilerleme ── -->
    <div id="progressSection" class="progress-section hidden">
      <div class="progress-track"><div id="progressBar" class="progress-fill"></div></div>
      <div id="progressText" class="progress-text">Baslatiliyor...</div>
    </div>

    <!-- ── Istatistik ── -->
    <div id="statsSection" class="stats-row hidden">
      <div class="stat-card">
        <div id="statTotal" class="stat-val">0</div>
        <div class="stat-lbl">Kanal</div>
      </div>
      <div class="stat-card stat-card--outlier">
        <div id="statOutlier" class="stat-val">0</div>
        <div class="stat-lbl">Outlier</div>
      </div>
      <div class="stat-card">
        <div id="statGrowth" class="stat-val">0</div>
        <div class="stat-lbl">Ort. Buyume</div>
      </div>
      <button id="exportBtn" class="btn btn-ghost btn-sm">CSV</button>
    </div>

    <!-- ── Hata ── -->
    <div id="errorSection" class="error-box hidden">
      <div class="error-title">Hata</div>
      <div id="errorText" class="error-msg"></div>
    </div>

    <!-- ── Sonuclar ── -->
    <div id="resultsSection" class="results-section hidden">
      <div class="table-scroll">
        <table class="tbl">
          <thead>
            <tr>
              <th>#</th>
              <th>Kanal</th>
              <th>Yas</th>
              <th>Abone</th>
              <th>En Iyi Video</th>
              <th>Izl/Abo</th>
              <th>Durum</th>
            </tr>
          </thead>
          <tbody id="resultsBody"></tbody>
        </table>
      </div>
    </div>

  </div><!-- .app -->
  <script src="sidepanel.js"></script>
</body>
</html>
